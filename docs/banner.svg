<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="妥了 ToDone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <!-- 背景与圆角 -->
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- 右侧装饰：三个错落的「任务卡」剪影，呼应三视图/三栏 -->
  <g opacity="0.14" fill="#ffffff">
    <rect x="880" y="52" width="230" height="58" rx="10"/>
    <rect x="910" y="122" width="230" height="58" rx="10"/>
    <rect x="880" y="192" width="230" height="58" rx="10"/>
  </g>
  <g opacity="0.35">
    <circle cx="906" cy="81" r="7" fill="#93c5fd"/>
    <circle cx="936" cy="151" r="7" fill="#93c5fd"/>
    <circle cx="906" cy="221" r="7" fill="#93c5fd"/>
  </g>

  <!-- 主标题 -->
  <text x="96" y="150" font-family="-apple-system, 'PingFang SC', 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="86" font-weight="700" fill="#ffffff">妥了 · ToDone</text>

  <!-- 副标题（渐变描出强调） -->
  <text x="98" y="212" font-family="-apple-system, 'PingFang SC', 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="30" font-weight="500" fill="url(#accent)">把任务安排到日子上 · 逾期不丢</text>

  <!-- 底部特性短语 -->
  <text x="98" y="256" font-family="-apple-system, 'PingFang SC', 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="17" fill="#bfdbfe" opacity="0.9">纯本地 · 离线可用 · 数据不出本机</text>
</svg>
